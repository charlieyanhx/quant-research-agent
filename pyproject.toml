[project]
name = "quant-research-agent"
version = "0.3.0"
description = "A research agent for quant backtests, and the evals that measure whether it catches known bugs and refuses to overstate results."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hanxiong (Charlie) Yan" }]
dependencies = ["numpy>=1.26", "pandas>=2.1", "pyyaml>=6", "anthropic>=0.70"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]
mcp = ["fastmcp>=2"]

[project.scripts]
qra = "qra.cli:main"
qra-mcp = "qra.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E501"]
